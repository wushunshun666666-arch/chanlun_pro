version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chanlun_backend
    ports:
      - "8000:8000"
    volumes:
      - ./chanlun.db:/app/chanlun.db
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./chanlun.db
      - TZ=Asia/Shanghai
    restart: unless-stopped

